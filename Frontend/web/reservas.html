<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Estudio Fotográfico</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Reserva tu Sesión Fotográfica</h1>
        <nav>
            <ul>
                <li><a href="/estudio/index.html">Inicio</a></li>
                <li><a href="/estudio/Frontend/web/portafolio.html">Portafolio</a></li>
                <li><a href="/estudio/Frontend/web/servicios.html">Servicios</a></li>
                <li><a href="/estudio/Frontend/web/reservas.html">Reservas</a></li>
                <li><a href="/estudio/Frontend/web/blog.html">Blog</a></li>
                <li><a href="/estudio/Frontend/web/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Formulario de Reserva</h2>
            <form action="../Backend/reservas.php" method="POST">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora" required>

                <label for="tipo_sesion">Tipo de sesión:</label>
                <select id="tipo_sesion" name="tipo_sesion" required>
                    <option value="Boda">Boda</option>
                    <option value="Retrato">Retrato</option>
                    <option value="Producto">Producto</option>
                </select>

                <button type="submit">Confirmar Reserva</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Estudio Fotográfico | Todos los derechos reservados</p>
    </footer>
</body>
</html>
